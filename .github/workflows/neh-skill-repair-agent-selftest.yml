# Runs the neh-skill-repair-agent regression suite (SKILL.md section 10 as
# executable checks) whenever the skill package changes.
name: neh-skill-repair-agent selftest

on:
  pull_request:
    paths:
      - ".github/skills/neh-skill-repair-agent/**"
      - ".github/workflows/neh-skill-repair-agent-selftest.yml"
  push:
    branches: [main]
    paths:
      - ".github/skills/neh-skill-repair-agent/**"

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run selftest (stdlib-only)
        run: python3 .github/skills/neh-skill-repair-agent/scripts/selftest.py
